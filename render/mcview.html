<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MC View</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<script src="../showcase/assets/three.min.js"></script>
<script>
/* Renders a mesh produced by tools/mcmesh.py with Minecraft-style flat lighting.
   Query: ?scene=<dir>&w=1920&h=1080&bg=sky|blueprint|transparent
   API:   window.shot({mode:'persp'|'ortho', pos:[x,y,z], look:[x,y,z], fov, zoom, up})
          window.setEntities([{kind:'tnt', p:[x,y,z], flash:0..1}, ...])           */
const Q = new URLSearchParams(location.search);
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080);
const BG = Q.get('bg') || 'sky';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: BG !== 'sky' });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
if (BG === 'sky') {
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#78a7ff'); gr.addColorStop(0.55, '#a9c9ff'); gr.addColorStop(1, '#c8dcff');
  g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
  scene.background = new THREE.CanvasTexture(c);
  scene.fog = new THREE.Fog(0xb8d2ff, 120, 420);
} else if (BG === 'blueprint') {
  renderer.setClearColor(0x0b2a4a, 1);
} else {
  renderer.setClearColor(0x000000, 0);
}
let persp = new THREE.PerspectiveCamera(50, W / H, 0.05, 2000);
let ortho = new THREE.OrthographicCamera(-W / 2, W / 2, H / 2, -H / 2, -2000, 2000);
let cam = persp;

const loader = new THREE.TextureLoader();
async function loadScene(dir) {
  const meta = await (await fetch(dir + '/mesh.json')).json();
  const bin = await (await fetch(dir + '/mesh.bin')).arrayBuffer();
  const atlas = await new Promise(r => loader.load(dir + '/atlas.png', r));
  atlas.magFilter = THREE.NearestFilter; atlas.minFilter = THREE.NearestFilter;
  atlas.generateMipmaps = false; atlas.encoding = THREE.sRGBEncoding;
  for (const [layer, L] of Object.entries(meta.layers)) {
    const n = L.vertices; if (!n) continue;
    const pos = new Float32Array(bin, L.offset, n * 3);
    const uv = new Float32Array(bin, L.offset + n * 12, n * 2);
    const col = new Uint8Array(bin, L.offset + n * 20, n * 3);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3, true));
    const translucent = layer === 'translucent';
    const mat = new THREE.MeshBasicMaterial({ map: atlas, vertexColors: true, side: THREE.DoubleSide,
      transparent: translucent, opacity: 1, alphaTest: translucent ? 0.02 : 0.5, depthWrite: !translucent });
    const m = new THREE.Mesh(g, mat); m.renderOrder = translucent ? 2 : 1;
    scene.add(m);
  }
  return meta;
}

// ---- entities (TNT etc.) rendered with the same atlas-free textures ----
const tntTex = {};
function tex(name) {
  if (!tntTex[name]) { const t = loader.load('textures/' + name + '.png'); t.magFilter = t.minFilter = THREE.NearestFilter; t.encoding = THREE.sRGBEncoding; tntTex[name] = t; }
  return tntTex[name];
}
const entityGroup = new THREE.Group(); scene.add(entityGroup);
let tntGeo = null, tntMats = null;
window.setEntities = function (list) {
  entityGroup.clear();
  if (!tntGeo) {
    tntGeo = new THREE.BoxGeometry(0.98, 0.98, 0.98);
    const side = tex('tnt_side'), top = tex('tnt_top'), bot = tex('tnt_bottom');
    const mk = (t, s) => new THREE.MeshBasicMaterial({ map: t, color: new THREE.Color(s, s, s) });
    tntMats = [mk(side, 0.6), mk(side, 0.6), mk(top, 1), mk(bot, 0.5), mk(side, 0.8), mk(side, 0.8)];
  }
  for (const e of list) {
    if (e.kind === 'tnt') {
      const m = new THREE.Mesh(tntGeo, e.flash ? tntMats.map(mm => { const c = mm.clone(); c.color.lerp(new THREE.Color(1, 1, 1), e.flash); return c; }) : tntMats);
      m.position.set(e.p[0], e.p[1] + 0.49, e.p[2]);
      entityGroup.add(m);
    } else if (e.kind === 'marker') {
      const m = new THREE.Mesh(new THREE.SphereGeometry(e.r || 0.3, 12, 8), new THREE.MeshBasicMaterial({ color: e.color || 0xff3300 }));
      m.position.set(...e.p); entityGroup.add(m);
    } else if (e.kind === 'line') {
      const g = new THREE.BufferGeometry().setFromPoints(e.pts.map(p => new THREE.Vector3(...p)));
      entityGroup.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color: e.color || 0xffcc00, linewidth: 2 })));
    }
  }
};

window.shot = function (o) {
  if (o.mode === 'ortho') {
    cam = ortho;
    const z = o.zoom || 20; // pixels per block
    ortho.left = -W / 2 / z; ortho.right = W / 2 / z; ortho.top = H / 2 / z; ortho.bottom = -H / 2 / z;
    ortho.position.set(...o.pos); ortho.up.set(...(o.up || [0, 1, 0])); ortho.lookAt(...o.look);
    ortho.updateProjectionMatrix();
  } else {
    cam = persp;
    persp.fov = o.fov || 50; persp.position.set(...o.pos); persp.up.set(0, 1, 0); persp.lookAt(...o.look);
    persp.updateProjectionMatrix();
  }
  renderer.render(scene, cam);
  return true;
};
window.ready = loadScene(Q.get('scene') || 'scene').then(m => (window.META = m, true));
</script>
</body>
</html>
